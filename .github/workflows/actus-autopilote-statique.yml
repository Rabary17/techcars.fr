name: Autopilote actus techcars (statique)

# Chaque jour : lit le sheet de veille, écrit les actus retenues dans
# content/posts/, puis commit et push sur la branche de
# production. Le push déclenche le déploiement Vercel (intégration Git).
# Même principe que techno-play : pas de WordPress, le site est reconstruit à
# chaque publication.
#
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   SHEETS_SERVICE_ACCOUNT_JSON  contenu complet du JSON du compte de service Google
#                                (ce compte doit être éditeur du sheet de veille)
#   CLAUDE_CODE_OAUTH_TOKEN      jeton généré avec `claude setup-token` (abonnement, comme techno-play)
#   VEILLE_SHEET_ID (optionnel)  identifiant du sheet, valeur par défaut dans le script

on:
  schedule:
    # 06:00 UTC = 09:00 à Antananarivo
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      n:
        description: "Nombre d'articles à écrire"
        default: "2"
      dry_run:
        description: "true = rédige sans écrire de fichier ni pousser"
        type: boolean
        default: false
      illustrer:
        description: "true = cherche une image pour les articles qui n'en ont pas (sans nouvelle actu)"
        type: boolean
        default: false

jobs:
  actus:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer la CLI Claude Code (auth par abonnement, pas l'API)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lancer l'autopilote
        env:
          SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.SHEETS_SERVICE_ACCOUNT_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VEILLE_SHEET_ID: ${{ secrets.VEILLE_SHEET_ID }}
        run: |
          N="${{ github.event.inputs.n || '2' }}"
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          ILL=""
          if [ "${{ github.event.inputs.illustrer }}" = "true" ]; then ILL="--illustrer"; fi
          node scripts/actus-autopilote.mjs --n="$N" $DRY $ILL

      - name: Commit et push (si de nouveaux articles)
        if: github.event.inputs.dry_run != 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          git config user.name "actus-autopilote[bot]"
          git config user.email "actus-autopilote@techcars.fr"
          git add content/posts
          if git diff --cached --quiet; then
            echo "Aucun nouvel article."
          else
            git commit -m "feat(actus): autopilote, nouveaux articles d'actualité"
            git push origin HEAD:${{ github.ref_name }}
            # Indexation : IndexNow (Bing) + sitemap soumis à Google Search Console
            NOUVELLES_URLS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- content/posts | sed -E 's#^content/posts/(.*)\.md$#https://techcars.fr/\1/#')
            NOUVELLES_URLS="$NOUVELLES_URLS" node scripts/indexation/submit.mjs
          fi
